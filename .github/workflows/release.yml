name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run test
      - name: Publish NPM Packages (@dsh-community/dsh-bridge & @dsh-community/tui)
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
      - run: pnpm install
      - run: pnpm run build
      - name: Build Desktop Binaries
        run: pnpm --filter @dsh-community/desktop package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
